[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["app"]
[tool.setuptools.package-data]
app = ["migrations/*.sql"]
[project]
name = "promo-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["argon2-cffi>=23.1,<26", "fastapi>=0.115,<1.0", "httpx>=0.27,<1.0", "pillow>=11,<13", "uvicorn[standard]>=0.30,<1.0"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E","F","I","UP","B"]
