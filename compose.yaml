services:
  web:
    build:
      context: ./web
      target: runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      bot:
        condition: service_started

  bot:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?defina em .env}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?defina em .env}
      # Rede Docker: comunicação entre containers sempre usa a porta 8080.
      EVOLUTION_BASE_URL: http://evolution:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-promocoes}
      WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-}
      SEND_ENABLED: ${SEND_ENABLED:-false}
      SQLITE_PATH: /app/data/offers.db
      MEDIA_ALLOWED_HOSTS: ${MEDIA_ALLOWED_HOSTS:-http2.mlstatic.com}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      evolution:
        condition: service_started

  evolution:
    # Versão estável publicada no namespace oficial (ADR 0004).
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      SERVER_URL: http://localhost:8085
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina em .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:?defina em .env}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: promo_radar_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: promo_radar
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
