name: CI
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: python -m py_compile agent/affiliate_worker.py app/apify_probe.py
      - run: pytest -q
      - run: docker compose --env-file .env.example config -q

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      # Smoke de catálogo offline: não aciona serviços cobrados em CI.
      DISCOVERY_PROVIDER: csv
    steps:
      - uses: actions/checkout@v4
      - name: Validar Compose
        run: docker compose --env-file .env.example config -q
      - name: Verificar imagem fixada da Evolution API
        run: |
          docker compose --env-file .env.example config --images | grep -Fx 'evoapicloud/evolution-api:v2.3.7'
          docker manifest inspect evoapicloud/evolution-api:v2.3.7 >/dev/null
      - name: Construir imagem do backend
        run: docker compose --env-file .env.example build bot
      - name: Executar testes Python dentro de Docker (Evolution simulada)
        run: |
          docker build --target test -t promo-radar:tests .
          docker run --rm promo-radar:tests pytest -q
      - name: Iniciar somente o backend (Evolution não pareada)
        run: docker compose --env-file .env.example up -d --no-deps bot
      - name: Verificar inicialização, SQLite e CLI
        run: |
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/promo-radar-health.json; then break; fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/promo-radar-health.json
          docker compose --env-file .env.example exec -T bot python -m app.evolution_admin --help
      - name: Exercitar busca por nicho via HTTP no Docker
        run: |
          mkdir -p data/import
          printf '%s\n'             'source_item_id,title,price_cents,product_url,image_url'             'MLB_TEST,Mouse de Teste,19990,https://www.mercadolivre.com.br/p/MLB123,'             > data/import/catalogo.csv
          admin_key=$(sed -n 's/^ADMIN_API_KEY=//p' .env.example | head -n 1)
          response=$(curl -fsS -X POST 'http://127.0.0.1:8000/api/v1/discovery/search'             -H "x-admin-key: $admin_key"             -H 'content-type: application/json'             --data '{"query":"mouse","limit":10}')
          search_id=$(printf '%s' "$response" | python -c             'import json,sys; x=json.load(sys.stdin); assert len(x["items"])==1; assert x["items"][0]["promotion_verified"] is False; print(x["search_id"])')
          selection=$(curl -fsS -X POST 'http://127.0.0.1:8000/api/v1/discovery/select'             -H "x-admin-key: $admin_key"             -H 'content-type: application/json'             --data "{\"search_id\":\"$search_id\",\"source_item_ids\":[\"MLB_TEST\"]}")
          printf '%s' "$selection" | python -c             'import json,sys; x=json.load(sys.stdin); assert x["selected"][0]["status"]=="DRAFT"; assert x["selected"][0]["created"] is True'
      - name: Validar bloqueios e cadastro de afiliado no Docker (HTTP)
        run: |
          admin_key=$(sed -n 's/^ADMIN_API_KEY=//p' .env.example | head -n 1)
          offers=$(curl -fsS 'http://127.0.0.1:8000/api/v1/offers'             -H "x-admin-key: $admin_key")
          offer_id=$(printf '%s' "$offers" | python -c             'import json,sys; xs=json.load(sys.stdin); print(next(x["id"] for x in xs if x["source"]=="mercado_livre"))')
          preview=$(curl -fsS "http://127.0.0.1:8000/api/v1/offers/$offer_id"             -H "x-admin-key: $admin_key")
          printf '%s' "$preview" | python -c             'import json,sys; x=json.load(sys.stdin); assert x["affiliate_url"] is None; assert x["product_url"].startswith("https://www.mercadolivre.com.br/")'
          blocked=$(curl -s -o /dev/null -w '%{http_code}' -X POST             "http://127.0.0.1:8000/api/v1/offers/$offer_id/approve"             -H "x-admin-key: $admin_key")
          test "$blocked" = 409
          curl -fsS -X POST             "http://127.0.0.1:8000/api/v1/offers/$offer_id/affiliate-link"             -H "x-admin-key: $admin_key"             -H 'content-type: application/json'             --data '{"affiliate_url":"https://meli.la/LINK-FICTICIO","product_match_confirmed":true}'             | python -c 'import json,sys; x=json.load(sys.stdin); assert x["affiliate_status"]=="OPERATOR_SUBMITTED"'
          curl -fsS -X POST             "http://127.0.0.1:8000/api/v1/offers/$offer_id/approve"             -H "x-admin-key: $admin_key"             | python -c 'import json,sys; assert json.load(sys.stdin)["status"]=="APPROVED"'
          blocked=$(curl -s -o /dev/null -w '%{http_code}' -X POST             "http://127.0.0.1:8000/api/v1/offers/$offer_id/publish"             -H "x-admin-key: $admin_key")
          test "$blocked" = 409
          status=$(curl -fsS 'http://127.0.0.1:8000/api/v1/affiliates/mercado-livre/status'             -H "x-admin-key: $admin_key")
          printf '%s' "$status" | python -c             'import json,sys; x=json.load(sys.stdin); assert not x["connected"]; assert not x["auto_generation_available"]'
      - name: Logs em caso de falha
        if: failure()
        run: docker compose --env-file .env.example logs bot || true
      - name: Encerrar serviços
        if: always()
        run: docker compose --env-file .env.example down
